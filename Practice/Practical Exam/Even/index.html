<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Fair Registration 2024</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Job Fair Registration 2024</h1>
            <p>Register for the biggest career opportunity event</p>
        </header>

        <form id="registrationForm">
            <!-- Identity Section -->
            <section class="form-section">
                <h2>Identity Information</h2>
                
                <div class="form-group">
                    <label for="candidateName">Full Name *</label>
                    <input type="text" id="candidateName" name="candidateName" required>
                    <div id="candidateNameError" class="error-message"></div>
                </div>
                
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" name="username" required>
                    <div id="usernameError" class="error-message"></div>
                    <div id="usernameStatus" class="status-message"></div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password" required>
                    <div id="passwordError" class="error-message"></div>
                    <div id="passwordStrength" class="strength-indicator"></div>
                </div>
            </section>

            <!-- Contact Section -->
            <section class="form-section">
                <h2>Contact Information</h2>
                
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required>
                    <div id="emailError" class="error-message"></div>
                    <div id="emailStatus" class="status-message"></div>
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phone" required placeholder="+91 XXXXXXXXXX">
                    <div id="phoneError" class="error-message"></div>
                </div>
                
                <div class="form-group">
                    <label for="pincode">Pincode *</label>
                    <input type="text" id="pincode" name="pincode" required placeholder="6-digit pincode">
                    <div id="pincodeError" class="error-message"></div>
                </div>
                
                <div class="form-group">
                    <label for="city">City *</label>
                    <input type="text" id="city" name="city" required readonly>
                    <div id="cityError" class="error-message"></div>
                </div>
                
                <div class="form-group">
                    <label for="state">State *</label>
                    <input type="text" id="state" name="state" required readonly>
                    <div id="stateError" class="error-message"></div>
                </div>
            </section>

            <!-- Academic Section -->
            <section class="form-section">
                <h2>Academic Information</h2>
                
                <div class="form-group">
                    <label for="graduationYear">Graduation Year *</label>
                    <input type="number" id="graduationYear" name="graduationYear" required min="2020" max="2030">
                    <div id="graduationYearError" class="error-message"></div>
                </div>
                
                <div class="form-group">
                    <label for="resumeUrl">Resume URL *</label>
                    <input type="url" id="resumeUrl" name="resumeUrl" required placeholder="https://example.com/resume.pdf">
                    <div id="resumeUrlError" class="error-message"></div>
                </div>
            </section>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to Terms & Conditions *</label>
            </div>

            <div style="text-align: center; margin-top: 30px;">
                <button type="submit" id="submitBtn" class="btn btn-primary" disabled>Register</button>
                <button type="button" id="resetBtn" class="btn btn-secondary">Reset</button>
            </div>
        </form>

        <div id="successMessage" class="success-popup">
            <h2 style="color: #28a745; margin-bottom: 15px;">🎉 Success!</h2>
            <p>Registration completed!</p>
            <p>ID: <span id="confirmationNumber"></span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
