<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Topology Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { display: flex; gap: 20px; }
        .controls { width: 300px; }
        .canvas { width: 500px; height: 400px; border: 1px solid #ccc; position: relative; background: #f9f9f9; }
        .node { position: absolute; width: 40px; height: 40px; border-radius: 50%; background: #4ecdc4; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; cursor: pointer; }
        .edge { position: absolute; background: #333; height: 2px; transform-origin: left center; }
        button { margin: 5px 0; padding: 10px; width: 100%; }
        #output { margin-top: 20px; padding: 10px; background: #f0f0f0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Simple Network Topology Generator</h1>
    
    <div class="container">
        <div class="controls">
            <button onclick="generateStar()">Generate Star Topology</button>
            <button onclick="generateMesh()">Generate Mesh Topology</button>
            <button onclick="generateHybrid()">Generate Hybrid Topology</button>
            <button onclick="clearAll()">Clear All</button>
            
            <h3>Test Routing</h3>
            <input id="sourceInput" placeholder="Source node (e.g., A)" />
            <input id="destInput" placeholder="Destination node (e.g., C)" />
            <button onclick="testRouting()">Find Path</button>
            
            <div id="output">Click a button to generate a topology</div>
        </div>
        
        <div class="canvas" id="canvas">
        </div>
    </div>

    <script>
        let nodes = [];
        let edges = [];

        function clearAll() {
            nodes = [];
            edges = [];
            document.getElementById('canvas').innerHTML = '';
            document.getElementById('output').innerHTML = 'Canvas cleared';
        }

        function createNode(name, x, y) {
            const canvas = document.getElementById('canvas');
            const node = document.createElement('div');
            node.className = 'node';
            node.textContent = name;
            node.style.left = x + 'px';
            node.style.top = y + 'px';
            node.setAttribute('data-node', name);
            canvas.appendChild(node);
            
            nodes.push({name, x, y, element: node});
            return node;
        }

        function createEdge(fromName, toName, weight) {
            const fromNode = nodes.find(n => n.name === fromName);
            const toNode = nodes.find(n => n.name === toName);
            
            if (!fromNode || !toNode) return;
            
            const canvas = document.getElementById('canvas');
            const edge = document.createElement('div');
            edge.className = 'edge';
            
            // Calculate position and angle
            const dx = toNode.x - fromNode.x;
            const dy = toNode.y - fromNode.y;
            const length = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx) * 180 / Math.PI;
            
            edge.style.left = (fromNode.x + 20) + 'px';
            edge.style.top = (fromNode.y + 20) + 'px';
            edge.style.width = length + 'px';
            edge.style.transform = `rotate(${angle}deg)`;
            edge.setAttribute('data-edge', `${fromName}-${toName}`);
            
            canvas.appendChild(edge);
            edges.push({fromName, toName, weight, element: edge});
        }

        function generateStar() {
            clearAll();
            
            // Create center node
            createNode('C', 250, 200);
            
            // Create surrounding nodes
            const radius = 120;
            const nodeNames = ['A', 'B', 'D', 'E', 'F'];
            nodeNames.forEach((name, i) => {
                const angle = (i * 2 * Math.PI) / nodeNames.length;
                const x = 250 + radius * Math.cos(angle);
                const y = 200 + radius * Math.sin(angle);
                createNode(name, x, y);
                
                // Connect to center
                const weight = Math.floor(Math.random() * 10) + 1;
                createEdge('C', name, weight);
            });
            
            document.getElementById('output').innerHTML = 'Star topology generated with 6 nodes';
        }

        function generateMesh() {
            clearAll();
            
            const nodeNames = ['A', 'B', 'C', 'D'];
            const positions = [
                {x: 150, y: 100},
                {x: 350, y: 100},
                {x: 350, y: 300},
                {x: 150, y: 300}
            ];
            
            // Create nodes
            nodeNames.forEach((name, i) => {
                createNode(name, positions[i].x, positions[i].y);
            });
            
            // Connect all to all
            for(let i = 0; i < nodeNames.length; i++) {
                for(let j = i + 1; j < nodeNames.length; j++) {
                    const weight = Math.floor(Math.random() * 15) + 1;
                    createEdge(nodeNames[i], nodeNames[j], weight);
                }
            }
            
            document.getElementById('output').innerHTML = 'Mesh topology generated with 4 fully connected nodes';
        }

        function generateHybrid() {
            clearAll();
            
            // Create hub
            createNode('Hub', 250, 200);
            
            // Create cluster 1
            createNode('A1', 150, 100);
            createNode('A2', 100, 200);
            createNode('A3', 150, 300);
            
            // Create cluster 2
            createNode('B1', 350, 100);
            createNode('B2', 400, 200);
            createNode('B3', 350, 300);
            
            // Connect hub to clusters
            ['A1', 'A2', 'A3', 'B1', 'B2', 'B3'].forEach(node => {
                const weight = Math.floor(Math.random() * 8) + 1;
                createEdge('Hub', node, weight);
            });
            
            // Connect within clusters
            createEdge('A1', 'A2', 3);
            createEdge('A2', 'A3', 4);
            createEdge('B1', 'B2', 2);
            createEdge('B2', 'B3', 5);
            
            document.getElementById('output').innerHTML = 'Hybrid topology generated with 7 nodes';
        }

        // Simple routing algorithms
        function buildGraph() {
            const graph = {};
            nodes.forEach(node => graph[node.name] = {});
            edges.forEach(edge => {
                graph[edge.fromName][edge.toName] = edge.weight;
                graph[edge.toName][edge.fromName] = edge.weight;
            });
            return graph;
        }

        function dijkstra(graph, start) {
            const distances = {};
            const previous = {};
            const unvisited = new Set();
            
            Object.keys(graph).forEach(node => {
                distances[node] = node === start ? 0 : Infinity;
                previous[node] = null;
                unvisited.add(node);
            });
            
            while(unvisited.size > 0) {
                let current = null;
                let minDist = Infinity;
                for(let node of unvisited) {
                    if(distances[node] < minDist) {
                        minDist = distances[node];
                        current = node;
                    }
                }
                
                if(current === null) break;
                unvisited.delete(current);
                
                for(let neighbor in graph[current]) {
                    if(unvisited.has(neighbor)) {
                        const newDist = distances[current] + graph[current][neighbor];
                        if(newDist < distances[neighbor]) {
                            distances[neighbor] = newDist;
                            previous[neighbor] = current;
                        }
                    }
                }
            }
            
            return {distances, previous};
        }

        function testRouting() {
            const source = document.getElementById('sourceInput').value.trim();
            const dest = document.getElementById('destInput').value.trim();
            
            if(!source || !dest) {
                document.getElementById('output').innerHTML = 'Please enter both source and destination nodes';
                return;
            }
            
            const graph = buildGraph();
            if(!graph[source] || !graph[dest]) {
                document.getElementById('output').innerHTML = 'One or both nodes do not exist';
                return;
            }
            
            const result = dijkstra(graph, source);
            const distance = result.distances[dest];
            
            if(distance === Infinity) {
                document.getElementById('output').innerHTML = `No path found from ${source} to ${dest}`;
                return;
            }
            
            // Reconstruct path
            const path = [];
            let current = dest;
            while(current !== null) {
                path.unshift(current);
                current = result.previous[current];
            }
            
            // Highlight path
            document.querySelectorAll('.node').forEach(el => el.style.background = '#4ecdc4');
            document.querySelectorAll('.edge').forEach(el => el.style.background = '#333');
            
            path.forEach(nodeName => {
                const nodeEl = document.querySelector(`[data-node="${nodeName}"]`);
                if(nodeEl) nodeEl.style.background = '#ff6b6b';
            });
            
            for(let i = 0; i < path.length - 1; i++) {
                const edgeEl = document.querySelector(`[data-edge="${path[i]}-${path[i+1]}"], [data-edge="${path[i+1]}-${path[i]}"]`);
                if(edgeEl) edgeEl.style.background = '#ff6b6b';
            }
            
            document.getElementById('output').innerHTML = `
                <strong>Shortest Path:</strong> ${path.join(' → ')}<br>
                <strong>Total Distance:</strong> ${distance}
            `;
        }
    </script>
</body>
</html>
