<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Network Packet Routing Simulation</title>
<style>
:root{--bg:#eef6fb; --node-size:54px; --node-radius:27px;}
*{box-sizing:border-box;font-family:Inter,Segoe UI,Arial,sans-serif;}
body{margin:0;background:var(--bg); color:#0b1b2b;-webkit-font-smoothing:antialiased;}
header{height:68px; display:flex; align-items:center; justify-content:center; background: linear-gradient(90deg,#09203f,#537895); color:white; font-weight:700; font-size:20px; letter-spacing:0.4px; box-shadow: 0 6px 18px rgba(11,27,43,0.12);}
#app{display:flex; gap:18px; padding:18px; height: calc(100vh - 68px);}
.canvas-wrap{flex:1.6; background: linear-gradient(180deg,#f9fcff,#eef6fb); border-radius:12px; padding:12px; position:relative; overflow:hidden; box-shadow: 0 6px 24px rgba(10,20,40,0.06);}
.canvas-topbar{position:absolute; top:10px; left:10px; z-index:30; background: rgba(255,255,255,0.7); padding:8px 10px; border-radius:8px; backdrop-filter: blur(6px);}
svg#edges-svg { width:100%; height:100%; display:block; }
.node { position:absolute; width:var(--node-size); height:var(--node-size); border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-weight:700; cursor:grab; box-shadow: 0 8px 20px rgba(18,38,67,0.14); user-select:none; transition: transform 0.12s ease, box-shadow .12s; z-index:40; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2), transparent), linear-gradient(135deg,#ffffff,#a0c4ff); color:#000;}
.node:active { cursor:grabbing; transform:scale(0.99); box-shadow:0 12px 26px rgba(18,38,67,0.22); }
.controls { flex:0.8; background:linear-gradient(180deg,#ffffff,#f6fbff); border-radius:12px; padding:16px; overflow:auto; box-shadow: 0 6px 24px rgba(10,20,40,0.06);}
.controls h3 { margin:6px 0 10px; font-size:16px; color:#102633; }
label { display:block; font-size:12px; color:#6b7280; margin-top:8px; }
input[type="text"], input[type="number"], select { width:100%; padding:8px 10px; border-radius:8px; border:1px solid #e2e8f0; background:white; margin-top:6px; font-size:14px; }
.btn { display:inline-block; width:100%; padding:10px 12px; border-radius:10px; border:0; color:white; font-weight:700; margin-top:10px; cursor:pointer; box-shadow: 0 8px 18px rgba(35,101,198,0.16); transition: transform .12s ease, box-shadow .12s ease, opacity .12s;}
.btn:active{ transform:translateY(1px) scale(.997); }
.btn-primary { background:linear-gradient(90deg,#2F80ED,#1F6CD8); }
.btn-accent { background:linear-gradient(90deg,#06D6A0,#06B58F); box-shadow:0 8px 18px rgba(6,181,143,0.14); }
.btn-ghost { background:transparent; color:#1f2937; border:1px solid #e6eef6; box-shadow:none; }
.routing-box { margin-top:12px; padding:10px; background:white; border-radius:10px; border:1px solid #eef4fb; box-shadow: 0 6px 16px rgba(17,34,51,0.04); }
.routing-box table { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
.routing-box th, .routing-box td { border:1px solid #f1f5f9; padding:6px; text-align:center; }
.edge-label { font-size:13px; fill:#062226; font-weight:700; pointer-events:none; }
.edge-line { stroke:#8aa0b3; stroke-width:3; stroke-linecap:round; transition: stroke 0.18s ease; }
.edge-line.highlight { stroke:#ff5b4d; stroke-width:4.5; filter:url(#glow); }
.hint { font-size:12px; color:#6b7280; margin-top:10px; text-align:center; }
@media (max-width:900px){ #app{ flex-direction:column; height: auto; } .canvas-wrap, .controls { width:100%; height:600px; } .controls { height:auto; } }
</style>
</head>
<body>
<header>Network Packet Routing Simulation</header>
<div id="app">
<div class="canvas-wrap" id="canvasWrap">
<div class="canvas-topbar">
<button id="addNodeBtn" class="btn btn-primary" style="display:inline-block;padding:6px 10px;font-size:13px">+ Add Node</button>
<button id="clearSelectBtn" class="btn btn-ghost" style="display:inline-block;padding:6px 10px;font-size:13px;margin-left:6px">Clear Sel</button>
<span style="margin-left:8px;font-size:13px;color:#6b7280">Drag nodes to reposition</span>
</div>
<svg id="edges-svg" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="4" result="coloredBlur"/>
<feMerge>
<feMergeNode in="coloredBlur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
</defs>
</svg>
</div>

<div class="controls">
<h3>Node</h3>
<label>Node Name</label>
<input id="nodeName" type="text" placeholder="E.g., A or R1" />
<button id="createNode" class="btn btn-accent">Create Node</button>

<h3 style="margin-top:14px">Edge</h3>
<label>From</label>
<select id="fromSelect"></select>
<label>To</label>
<select id="toSelect"></select>
<label>Weight</label>
<input id="edgeWeight" type="number" placeholder="e.g., 5" />
<button id="addEdge" class="btn btn-primary">Add Edge</button>

<h3 style="margin-top:14px">Simulation</h3>
<label>Algorithm</label>
<select id="algorithm">
<option value="distanceVector">Distance Vector</option>
<option value="dijkstra">Dijkstra (single-source)</option>
<option value="bellmanFord">Bellman-Ford (single-source)</option>
<option value="floydWarshall">Floyd-Warshall (all-pairs)</option>
</select>
<label>Source Node (Dijkstra / Bellman-Ford)</label>
<input id="sourceNode" type="text" placeholder="Enter source node name (e.g., A)" />
<button id="runSim" class="btn btn-accent">Run Simulation</button>
<button id="resetAll" class="btn btn-ghost">Reset Canvas</button>

<div class="routing-box" id="routingBox">
<h3 style="margin:0">Routing Table</h3>
<div id="routingContent" style="margin-top:8px">No data yet</div>
</div>
<p class="hint">Tip: Click node names in selectors to choose; use "Clear Sel" to unselect when needed.</p>
</div>
</div>

<script>
// --- Data ---
let nodes=[], edges=[];
const canvas=document.getElementById('canvasWrap');
const edgesSVG=document.getElementById('edges-svg');
const nodeRadius=27;
const fromSelect=document.getElementById('fromSelect');
const toSelect=document.getElementById('toSelect');

// --- Node Functions ---
function findNode(name){return nodes.find(n=>n.name===name);}
function updateSelectors(){
    fromSelect.innerHTML=''; toSelect.innerHTML='';
    nodes.forEach(n=>{
        const opt1=document.createElement('option'); opt1.value=n.name; opt1.textContent=n.name; fromSelect.appendChild(opt1);
        const opt2=document.createElement('option'); opt2.value=n.name; opt2.textContent=n.name; toSelect.appendChild(opt2);
    });
}
function makeDraggable(nodeObj){
    const el=nodeObj.el; let offsetX, offsetY, dragging=false;
    el.addEventListener('mousedown',e=>{dragging=true; offsetX=e.clientX-el.offsetLeft; offsetY=e.clientY-el.offsetTop; el.style.transition='none';});
    document.addEventListener('mousemove',e=>{
        if(!dragging) return;
        let newX=e.clientX-offsetX; let newY=e.clientY-offsetY;
        newX=Math.max(0,Math.min(canvas.clientWidth-nodeRadius*2,newX));
        newY=Math.max(0,Math.min(canvas.clientHeight-nodeRadius*2,newY));
        el.style.left=newX+'px'; el.style.top=newY+'px'; nodeObj.x=newX; nodeObj.y=newY;
        updateAllEdges();
    });
    document.addEventListener('mouseup',()=>{dragging=false;});
}
document.getElementById('createNode').addEventListener('click',()=>{
    const name=document.getElementById('nodeName').value.trim();
    if(!name){alert('Enter node name');return;}
    if(nodes.some(n=>n.name===name)){alert('Node already exists');return;}
    const x=Math.random()*(canvas.clientWidth-nodeRadius*2);
    const y=Math.random()*(canvas.clientHeight-nodeRadius*2);
    const nodeEl=document.createElement('div'); nodeEl.classList.add('node'); nodeEl.style.left=x+'px'; nodeEl.style.top=y+'px'; nodeEl.textContent=name;
    canvas.appendChild(nodeEl);
    const nodeObj={name,el:nodeEl,x,y}; nodes.push(nodeObj);
    updateSelectors(); makeDraggable(nodeObj);
});

// --- Edge Functions ---
document.getElementById('addEdge').addEventListener('click',()=>{
    const fromName=fromSelect.value; const toName=toSelect.value;
    const weight=parseFloat(document.getElementById('edgeWeight').value);
    if(!fromName||!toName||isNaN(weight)){alert('Select nodes and enter weight');return;}
    if(fromName===toName){alert('Cannot connect node to itself');return;}
    if(edges.some(e=>(e.fromName===fromName && e.toName===toName)||(e.fromName===toName && e.toName===fromName))){alert('Edge already exists');return;}
    const line=document.createElementNS("http://www.w3.org/2000/svg","line"); line.classList.add('edge-line'); edgesSVG.appendChild(line);
    const text=document.createElementNS("http://www.w3.org/2000/svg","text"); text.classList.add('edge-label'); text.textContent=weight; edgesSVG.appendChild(text);
    edges.push({fromName,toName,weight,lineEl:line,textEl:text}); updateAllEdges();
});
function updateAllEdges(){
    edges.forEach(e=>{
        const n1=findNode(e.fromName), n2=findNode(e.toName); if(!n1||!n2)return;
        const p1={x:n1.x+nodeRadius,y:n1.y+nodeRadius}; const p2={x:n2.x+nodeRadius,y:n2.y+nodeRadius};
        e.lineEl.setAttribute('x1',p1.x); e.lineEl.setAttribute('y1',p1.y);
        e.lineEl.setAttribute('x2',p2.x); e.lineEl.setAttribute('y2',p2.y);
        const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
        e.textEl.setAttribute('x',mx); e.textEl.setAttribute('y',my-15); e.textEl.textContent=e.weight;
    });
}

// --- Reset ---
document.getElementById('resetAll').addEventListener('click',()=>{
    nodes.forEach(n=>canvas.removeChild(n.el));
    edges.forEach(e=>{ edgesSVG.removeChild(e.lineEl); edgesSVG.removeChild(e.textEl); });
    nodes=[]; edges=[]; updateSelectors();
});

// --- Graph Functions ---
function buildGraph(){
    const g={};
    nodes.forEach(n=>{ g[n.name]={}; });
    edges.forEach(e=>{ g[e.fromName][e.toName]=e.weight; g[e.toName][e.fromName]=e.weight; });
    return g;
}

// --- Distance Vector Simulation ---
function distanceVector(){
    const g=buildGraph();
    const dist={}, next={};
    nodes.forEach(u=>{ dist[u.name]={}; next[u.name]={}; nodes.forEach(v=>{ if(u.name===v.name) dist[u.name][v.name]=0; else if(g[u.name][v.name]!==undefined) dist[u.name][v.name]=g[u.name][v.name]; else dist[u.name][v.name]=Infinity; next[u.name][v.name]=g[u.name][v.name]!==undefined?v.name:null; }); });
    nodes.forEach(()=>nodes.forEach(i=>nodes.forEach(j=>nodes.forEach(k=>{ if(dist[i.name][k.name]+dist[k.name][j.name]<dist[i.name][j.name]){ dist[i.name][j.name]=dist[i.name][k.name]+dist[k.name][j.name]; next[i.name][j.name]=next[i.name][k.name]; } }))));
    return dist;
}

// --- Dijkstra ---
function dijkstra(src){
    const g=buildGraph();
    const dist={}, prev={}; nodes.forEach(n=>{ dist[n.name]=Infinity; prev[n.name]=null; }); dist[src]=0;
    const Q=nodes.map(n=>n.name);
    while(Q.length){
        Q.sort((a,b)=>dist[a]-dist[b]);
        const u=Q.shift();
        for(const v in g[u]){
            const alt=dist[u]+g[u][v];
            if(alt<dist[v]){ dist[v]=alt; prev[v]=u; }
        }
    }
    return {dist,prev};
}

// --- Bellman-Ford ---
function bellmanFord(src){
    const g=buildGraph();
    const dist={}, prev={}; nodes.forEach(n=>{ dist[n.name]=Infinity; prev[n.name]=null; }); dist[src]=0;
    for(let i=0;i<nodes.length-1;i++){
        edges.forEach(e=>{
            if(dist[e.fromName]+e.weight<dist[e.toName]){ dist[e.toName]=dist[e.fromName]+e.weight; prev[e.toName]=e.fromName; }
            if(dist[e.toName]+e.weight<dist[e.fromName]){ dist[e.fromName]=dist[e.toName]+e.weight; prev[e.fromName]=e.toName; }
        });
    }
    return {dist,prev};
}

// --- Floyd-Warshall ---
function floydWarshall(){
    const g=buildGraph();
    const dist={}, next={};
    nodes.forEach(u=>{ dist[u.name]={}; next[u.name]={}; nodes.forEach(v=>{ if(u.name===v.name) dist[u.name][v.name]=0; else if(g[u.name][v.name]!==undefined) dist[u.name][v.name]=g[u.name][v.name]; else dist[u.name][v.name]=Infinity; next[u.name][v.name]=g[u.name][v.name]!==undefined?v.name:null; }); });
    nodes.forEach(k=>nodes.forEach(i=>nodes.forEach(j=>{ if(dist[i.name][k.name]+dist[k.name][j.name]<dist[i.name][j.name]){ dist[i.name][j.name]=dist[i.name][k.name]+dist[k.name][j.name]; next[i.name][j.name]=next[i.name][k.name]; } })));
    renderRoutingTable(dist);
}

// --- Render ---
function renderRoutingTable(dist){
    let html='<table><tr><th>From\\To</th>';
    nodes.forEach(n=>{ html+='<th>'+n.name+'</th>'; }); html+='</tr>';
    nodes.forEach(i=>{
        html+='<tr><th>'+i.name+'</th>';
        nodes.forEach(j=>{ html+='<td>'+ (dist[i.name][j.name]===Infinity?'∞':dist[i.name][j.name]) +'</td>'; });
        html+='</tr>';
    });
    html+='</table>'; document.getElementById('routingContent').innerHTML=html;
}

// --- Run Simulation ---
document.getElementById('runSim').addEventListener('click',()=>{
    const algo=document.getElementById('algorithm').value;
    const source=document.getElementById('sourceNode').value.trim();
    if((algo==='dijkstra'||algo==='bellmanFord') && !source){ alert('Enter source node'); return; }
    if(algo==='dijkstra') renderRoutingTable(dijkstra(source).dist);
    else if(algo==='bellmanFord') renderRoutingTable(bellmanFord(source).dist);
    else if(algo==='distanceVector') renderRoutingTable(distanceVector());
    else if(algo==='floydWarshall') floydWarshall();
});
</script>
</body>
</html>
