<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events & Student Profiles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Events & Student Profiles</h1>
        <p>Simple JSON parsing and display demo</p>

        <div class="section">
            <h2>Events List</h2>
            <div id="events-list"></div>
            <button onclick="showEventsJSON()">Show Events JSON</button>
            <div id="events-json" style="display: none;"></div>
        </div>

        <div class="section">
            <h2>Student Profiles</h2>
            <div id="students-list"></div>
            <button onclick="showStudentsJSON()">Show Students JSON</button>
            <div id="students-json" style="display: none;"></div>
        </div>

        <footer>
            <p><strong>Learning:</strong> Basic JSON parsing and array handling</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
